name: Build and Publish abricate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: picotainers-local/abricate:smoke

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm picotainers-local/abricate:smoke abricate --help > help.txt 2>&1 || true
          grep -Eiq 'abricate|usage|synopsis|version' help.txt
          docker run --rm picotainers-local/abricate:smoke abricate --version
          docker run --rm picotainers-local/abricate:smoke abricate --check
          docker run --rm picotainers-local/abricate:smoke abricate --list

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/picotainers/abricate:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
